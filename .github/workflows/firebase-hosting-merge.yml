name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Astro 7 需要 Node 22.22 以上，固定用和本機相同的 Node 24。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 測試沒過就不會建置和部署。
      - run: npm ci && npm test && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RYANHSUWEB }}
          channelId: live
          projectId: ryanhsuweb
