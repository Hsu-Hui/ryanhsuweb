name: Threads 發文提醒
on:
  schedule:
    # 台北時間中午 12 點與晚上 8 點。
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 提醒時段
        type: choice
        options: [noon, evening]
permissions:
  contents: read
  issues: read
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/threads
            src/content/posts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/threads/remind.mjs ${{ inputs.slot || (github.event.schedule == '0 4 * * *' && 'noon' || 'evening') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
